name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['package.json', 'notes/**', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release, e.g. v1.5.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick version
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then TAG="${GITHUB_REF_NAME}"; else TAG="${{ inputs.tag }}"; fi
          [ -n "$TAG" ] || TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.v.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.v.outputs.skip != 'true'
        run: npm ci
      - if: steps.v.outputs.skip != 'true'
        run: npm run build
        env:
          # Code signing (removes the SmartScreen warning). Add these repository secrets when you have a
          # Windows code-signing certificate: WIN_CSC_LINK = base64 of the .pfx, WIN_CSC_KEY_PASSWORD = its password.
          # While they are empty the installer is built unsigned, exactly as before.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Publish release
        if: steps.v.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          NOTES="notes/${TAG}.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          gh release create "$TAG" dist/Aurora-Setup.exe --title "Aurora ${TAG#v}" --notes-file "$NOTES" --latest --target "$GITHUB_SHA"
