name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release, e.g. v1.5.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/Aurora-win32-x64/* -DestinationPath Aurora-win64.zip
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          NOTES="notes/${TAG}.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          gh release create "$TAG" Aurora-win64.zip --title "Aurora ${TAG#v}" --notes-file "$NOTES" --latest --target "$GITHUB_SHA"
