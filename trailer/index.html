<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aurora Trailer</title>
<style>
@font-face{font-family:Figtree;src:url(fonts/figtree.woff2) format('woff2');font-weight:300 900}
html,body{margin:0;background:#000;overflow:hidden}
#frame{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:Figtree,system-ui,sans-serif;color:#fff}
#stage canvas{display:block}
#bars{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 110px 0 #000,inset 0 -110px 0 #000}
#vignette{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 50%,transparent 55%,rgba(0,0,0,.55))}
#flash{position:absolute;inset:0;background:#fff;opacity:0;mix-blend-mode:screen}
#fade{position:absolute;inset:0;background:#000;opacity:0}
#titles{position:absolute;inset:0}
#shade{position:absolute;inset:0;opacity:0;background:radial-gradient(60% 45% at 50% 52%,rgba(2,4,14,.62),transparent 75%)}
.tx{position:absolute;left:50%;top:50%;opacity:0;white-space:nowrap;text-align:center;will-change:transform,opacity}
.line{top:auto;bottom:40px;font-size:44px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;
  text-shadow:0 0 24px rgba(120,220,255,.55),0 2px 10px rgba(0,0,0,.8)}
.line{top:1000px}
.ident{display:flex;align-items:center;gap:34px}
.ident svg{width:170px;height:170px;filter:drop-shadow(0 0 30px rgba(255,99,57,.35))}
.ident div{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.ident b{font-size:96px;font-weight:900;letter-spacing:.14em;line-height:1}
.ident span{font-size:30px;font-weight:500;letter-spacing:.6em;text-transform:uppercase;color:#ffb39e;padding-left:6px}
.chapter{top:500px;font-size:112px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;line-height:1;
  background:linear-gradient(180deg,#f4ffd8,#b8f07a 60%,#6fcf6a);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 28px rgba(160,255,120,.45)) drop-shadow(0 4px 16px rgba(0,0,0,.7))}
.chapter small{display:block;font-size:34px;font-weight:600;letter-spacing:.7em;margin-bottom:22px;color:#e8ffd0;-webkit-text-fill-color:#e8ffd0}
.title{top:450px;font-size:220px;font-weight:900;line-height:1;
  background:linear-gradient(180deg,#ffffff 10%,#b6fff0 45%,#7fe0ff 70%,#b58bff);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 40px rgba(110,255,210,.55)) drop-shadow(0 0 120px rgba(120,140,255,.45))}
.end{top:720px;display:flex;flex-direction:column;align-items:center;gap:26px}
.end p{margin:0;font-size:40px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;text-shadow:0 2px 14px rgba(0,0,0,.9)}
.end .lock{display:flex;align-items:center;gap:16px;padding:14px 30px 14px 18px;border-radius:999px;background:rgba(8,10,20,.55);
  border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px)}
.end .lock svg{width:64px;height:64px}
.end .lock b{font-size:44px;font-weight:800;letter-spacing:.04em}
</style>
</head>
<body>
<div id="frame">
  <div id="stage"></div>
  <div id="vignette"></div>
  <div id="bars"></div>
  <div id="shade"></div>
  <div id="titles"></div>
  <div id="flash"></div>
  <div id="fade"></div>
</div>
<script type="module" src="trailer.bundle.js"></script>
</body>
</html>
